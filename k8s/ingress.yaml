apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-router-ingress
  namespace: llm-proxy
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: litellm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm-router
                port:
                  number: 80