apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: infra
spec:
  project: default
  source:
    repoURL: "http://gitea-service.infra.svc.cluster.local:8085/sreadmin/llm-router.git"
    targetRevision: master
    path: "charts/litellm-router"
    helm:
      valueFiles:
        - "values.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: llm-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-application-controller-admin-binding
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: infra
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io