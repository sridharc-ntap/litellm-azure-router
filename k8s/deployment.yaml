apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-router
  namespace: llm-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-router
  template:
    metadata:
      labels:
        app: litellm-router
    spec:
      containers:
        - name: router
          image: acr4llm.azurecr.io/litellm-azure-router:0.0.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: azure-openai
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 6
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"